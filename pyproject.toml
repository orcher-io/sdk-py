[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "orcher-sdk"
version = "0.4.2"
description = "Python SDK for ORCHER: crash-proof workflows written as plain async Python"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "ORCHER Contributors" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
keywords = ["workflow", "durable", "orchestration", "distributed", "async"]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
opentelemetry = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
prometheus = [
    "prometheus-client>=0.17",
]

[project.urls]
Homepage = "https://github.com/orcher-io/sdk-py"
Documentation = "https://github.com/orcher-io/sdk-py"
Repository = "https://github.com/orcher-io/sdk-py"
Issues = "https://github.com/orcher-io/sdk-py/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "orcher._native"
# The sdist carries what building and testing the package needs, not the
# repository's CI, release configuration, banner or engine contract suite.
exclude = [
    { path = ".github/**/*", format = "sdist" },
    { path = ".cargo/**/*", format = "sdist" },
    { path = "assets/**/*", format = "sdist" },
    { path = "contract/**/*", format = "sdist" },
    { path = ".gitignore", format = "sdist" },
    { path = ".release-please-manifest.json", format = "sdist" },
    { path = "release-please-config.json", format = "sdist" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["src/orcher"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/", "native/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
# ANN401: allow `Any`. Workflow and task inputs and outputs are arbitrary
# user-defined types serialized to and from JSON, so the serialization
# boundaries have to accept `Any`.
# UP042: keep `(str, Enum)`. `StrEnum` changes what `str()` and `format()`
# return for a member, which is public behavior.
ignore = ["ANN401", "UP042"]
