[package]
name = "orcher-sdk-py"
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
description = "Python bindings for ORCHER SDK Core"
repository = "https://github.com/orcher-io/sdk-py"

# This crate is excluded from the main workspace and has its own workspace
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
# PyO3 for Python bindings (using abi3 for forward compatibility)
pyo3 = { version = "0.23", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }

# ORCHER SDK Core - the Rust implementation
orcher-sdk-core = "0.8.1"

# ORCHER Proto - gRPC definitions
orcher-proto = "0.1"

# gRPC client
tonic = { version = "0.12", features = ["transport", "tls", "tls-native-roots"] }
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1.35", features = ["full", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression (used by codec bindings)
flate2 = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# Lazily initialized statics
once_cell = "1.19"

# Base64 encoding for bytes in JSON
base64 = "0.22"

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }

