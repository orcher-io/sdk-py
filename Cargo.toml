[package]
name = "orcher-sdk-py"
version = "0.4.14"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
description = "Python bindings for ORCHER SDK Core"
repository = "https://github.com/orcher-io/sdk-py"

# This crate is excluded from the main workspace and has its own workspace
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
# PyO3 for Python bindings (using abi3 for forward compatibility)
pyo3 = { version = "0.23", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }

# ORCHER SDK Core, from crates.io: the kernel, the worker host and the
# clients this crate binds for Python, speaking encoded kernel and host
# messages. To build against a local checkout instead, see
# .cargo/config.example.toml.
orcher-sdk-core = "0.20.1"

# Async runtime
tokio = { version = "1.35", features = ["full", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Compression (used by codec bindings)
flate2 = "1.0"

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# Lazily initialized statics
once_cell = "1.19"

# Base64 encoding for bytes in JSON
base64 = "0.22"

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }

